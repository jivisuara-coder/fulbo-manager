<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fulbo Manager</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f5;
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #064e3b, #15803d);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    main {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ Fulbo Manager</h1>
    <p>Organizá tus partidos. Armá tus equipos. Jugá.</p>
  </header>

  <main>
    <h2>Jugadores</h2>
    <p>Administrá los jugadores de tu grupo de fútbol.</p>
  </main>

</body>
</html>
